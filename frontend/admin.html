<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Mensagens</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Mensagens do Formulário</h1>
      <button id="btnLogout" class="bg-red-500 text-white px-4 py-2 rounded">Sair</button>
    </div>
    <div id="lista" class="flex flex-col gap-4"></div>
  </div>

  <script>
    async function carregarMensagens() {
      const res = await fetch('http://localhost:3000/contato', {
        method: 'GET',
        credentials: 'include'
      });

      if (res.status === 401) {
        window.location.href = 'login.html'; // Se a sessão for inválida, joga para o login
        return;
      }

      const mensagens = await res.json();
      const container = document.getElementById('lista');
      container.innerHTML = '';

      mensagens.forEach(msg => {
        container.innerHTML += `
          <div class="bg-white p-4 rounded shadow">
            <p><strong>Nome:</strong> ${msg.nome}</p>
            <p><strong>Mensagem:</strong> ${msg.mensagem}</p>
            <small class="text-gray-400">${new Date(msg.createdAt).toLocaleString()}</small>
          </div>
        `;
      });
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('http://localhost:3000/logout', { method: 'POST', credentials: 'include' });
      window.location.href = 'login.html';
    });

    carregarMensagens();
  </script>
</body>
</html>
