<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>
  <!-- Script do Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Painel de Administração</h2>
      <p class="text-slate-500 text-sm mt-1">Entre com suas credenciais para acessar</p>
    </div>

    <form id="formLogin" class="flex flex-col gap-4">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required 
               class="w-full p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-700 focus:border-transparent transition">
      </div>

      <div>
        <label for="senha" class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required 
               class="w-full p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-700 focus:border-transparent transition">
      </div>

      <button type="submit" 
              class="bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-lg shadow transition duration-200 mt-2">
        Entrar
      </button>
    </form>

    <p id="erro" class="text-red-500 text-sm mt-4 text-center font-medium"></p>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        const res = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, senha })
        });

        if (res.ok) {
          window.location.href = 'admin.html';
        } else {
          const dados = await res.json();
          document.getElementById('erro').innerText = dados.error || 'Erro ao logar';
        }
      } catch (err) {
        document.getElementById('erro').innerText = 'Erro ao conectar ao servidor';
      }
    });
  </script>
</body>
</html>
